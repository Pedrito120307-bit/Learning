<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Rango Numerico</title>
    </head>
    <body>
        <h1>Bienvenido a Rango Numerico</h1>
        <div>
            <h3>Funcionamiento del rango numérico:</h3>

            <ul>
                <li>El rango numérico permite definir un conjunto de valores entre dos extremos (definidos por usted).</li>
                <li>Los valores ingresados deben ser números.</li>
                <li>El primer valor debe ser menor que el segundo valor.</li>
            </ul>

            <button id="create-range">Crear Rango</button>

        </div>

        <div id="range-input"></div>
        <div id="range-output"></div>

        <script src="codigo.js"></script>
    </body>
</html>
